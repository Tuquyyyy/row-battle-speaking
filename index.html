<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Row Battle Speaking</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: a 1600×900 slide canvas scaled to fit the screen (letterboxed), like a PowerPoint show.
   → / PageDown / clicker advances step-by-step (Draw → Think → Share → next slide). */
:root {
  --bg: #E9EEF5; --frame: #D5DCE8;
  --surface: #FFFFFF; --surface-2: #F1F4F9;
  --ink: #141A33; --muted: #5A6283; --line: #CBD3E3;
  --accent: #2F4BFF; --accent-ink: #FFFFFF;
  --t0: #FF6B57; --t0-soft: #FFE3DE;
  --t1: #F5B21B; --t1-soft: #FFF1CC;
  --t2: #14A88F; --t2-soft: #D3F3EC;
  --t3: #7C6CF2; --t3-soft: #E6E2FF;
  --think: #F5B21B; --pair: #FF6B57; --share: #14A88F; --danger: #E5383B;
  --shadow: 0 1px 0 rgba(20,26,51,.06), 0 14px 36px -14px rgba(20,26,51,.28);
  --f-display: 'Archivo', 'Arial Narrow', Arial, sans-serif;
  --f-body: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#0F1326; --frame:#080B18; --surface:#191E37; --surface-2:#232A50; --ink:#EEF1FF; --muted:#A3AACB; --line:#2E3560;
  --accent:#6E83FF; --accent-ink:#0F1326;
  --t0-soft:#3A2230; --t1-soft:#3A3120; --t2-soft:#163A3A; --t3-soft:#2B2756;
  --shadow: 0 1px 0 rgba(0,0,0,.3), 0 14px 36px -14px rgba(0,0,0,.6); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg:#0F1326; --frame:#080B18; --surface:#191E37; --surface-2:#232A50; --ink:#EEF1FF; --muted:#A3AACB; --line:#2E3560;
  --accent:#6E83FF; --accent-ink:#0F1326;
  --t0-soft:#3A2230; --t1-soft:#3A3120; --t2-soft:#163A3A; --t3-soft:#2B2756;
  --shadow: 0 1px 0 rgba(0,0,0,.3), 0 14px 36px -14px rgba(0,0,0,.6); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--frame); color: var(--ink); font-family: var(--f-body); overflow: hidden;
  padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
#viewport { position: relative; width: 100%; height: 100%; display: grid; place-items: center; overflow: hidden; }
#deck { width: 1600px; height: 900px; position: absolute; left: 50%; top: 50%; transform-origin: 0 0;
  background: var(--bg); overflow: hidden; border-radius: 6px; }
.slide { position: absolute; inset: 0; padding: 56px 72px 92px; display: flex; flex-direction: column; gap: 28px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, summary:focus-visible { outline: 4px solid var(--accent); outline-offset: 3px; }
h1,h2,h3,p { margin: 0; }
.display { font-family: var(--f-display); font-stretch: 75%; font-weight: 900; text-transform: uppercase; line-height: .92; letter-spacing: -.01em; }
.eyebrow { font-size: 18px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.panel { background: var(--surface); border-radius: 26px; box-shadow: var(--shadow); }
.row { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }

/* bottom bar */
.bar { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; display: flex; align-items: center; gap: 16px; padding: 0 28px; z-index: 5; }
.bar .prog { flex: 1; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar .prog i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
.bar .count { font-weight: 800; font-size: 17px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 70px; text-align: center; }
.nav { border: 0; width: 46px; height: 46px; border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); font-size: 22px; font-weight: 900; display: grid; place-items: center; }
.nav[disabled] { opacity: .3; pointer-events: none; }
.barbtn { border: 0; border-radius: 12px; height: 46px; padding: 0 16px; background: var(--surface); box-shadow: var(--shadow); font-weight: 800; font-size: 16px; }
.keys { font-size: 15px; color: var(--muted); font-weight: 600; }

/* buttons */
.btn { border: 0; border-radius: 16px; padding: 16px 26px; font-weight: 800; font-size: 24px; background: var(--surface-2); color: var(--ink); box-shadow: inset 0 0 0 2px var(--line); transition: transform .08s, filter .15s; }
.btn:hover { filter: brightness(.97); } .btn:active { transform: translateY(2px); }
.btn.primary { background: var(--accent); color: var(--accent-ink); box-shadow: none; }
.btn.team { background: var(--c); color: #141A33; box-shadow: none; font-size: 32px; min-width: 100px; }
.btn.sm { font-size: 18px; padding: 10px 16px; border-radius: 12px; }
.btn[disabled] { opacity: .35; pointer-events: none; }

/* score strip */
.scores { display: flex; gap: 14px; }
.score { min-width: 170px; padding: 12px 20px 12px 26px; border-radius: 18px; background: var(--surface); box-shadow: var(--shadow); position: relative; overflow: hidden;
  display: grid; grid-template-columns: 1fr auto; align-items: center; column-gap: 14px; }
.score::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 10px; background: var(--c); }
.score .tn { font-weight: 800; font-size: 20px; }
.score .lead { font-size: 14px; font-weight: 800; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; }
.score .num { font-family: var(--f-display); font-stretch: 75%; font-weight: 900; font-size: 60px; line-height: 1; grid-row: span 2; font-variant-numeric: tabular-nums; }
.score.leader { background: var(--soft); }
.head { display: flex; justify-content: space-between; align-items: center; gap: 24px; }
.head h1 { font-size: 64px; } .head h1 span { color: var(--accent); }

/* ---------- title slide ---------- */
.title-slide { justify-content: center; padding-left: 120px; }
.title-slide .big { font-size: 220px; line-height: .82; }
.title-slide .big span { color: var(--accent); display: block; }
.title-slide .sub { font-size: 34px; font-weight: 700; max-width: 900px; color: var(--muted); }
.title-slide .sub b { color: var(--ink); }
.blocks { position: absolute; right: 90px; top: 50%; transform: translateY(-58%); display: grid; grid-template-columns: 380px; gap: 20px; }
.blocks div { height: 150px; border-radius: 28px; background: var(--c); display: flex; flex-direction: column; justify-content: center; gap: 6px; padding: 0 32px; font-family: var(--f-display); font-stretch: 75%; font-weight: 900; font-size: 60px; line-height: .95; text-transform: uppercase; color: #141A33; overflow: hidden; }
.blocks div span { order: -1; font-family: var(--f-body); font-size: 18px; font-weight: 800; letter-spacing: .16em; opacity: .7; }

/* ---------- rules slide ---------- */
.rules { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; flex: 1; }
.rule { padding: 30px; display: flex; flex-direction: column; gap: 14px; }
.rule .n { font-family: var(--f-display); font-stretch: 75%; font-weight: 900; font-size: 64px; line-height: 1; color: var(--c, var(--accent)); }
.rule h3 { font-size: 32px; font-weight: 800; }
.rule p { font-size: 23px; font-weight: 500; line-height: 1.35; color: var(--muted); }
.rule p b { color: var(--ink); }
.pts { display: flex; flex-wrap: wrap; gap: 8px; }
.pts span { background: var(--surface-2); border-radius: 10px; padding: 6px 12px; font-weight: 800; font-size: 19px; }


/* ---------- teams slide ---------- */
.teamsgrid { display: grid; grid-template-columns: repeat(var(--cols), 1fr); gap: 22px; flex: 1; min-height: 0; }
.tbox { border-radius: 26px; background: var(--soft); padding: 20px 22px 22px; display: flex; flex-direction: column; gap: 14px; position: relative; overflow: hidden; }
.tbox::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 8px; background: var(--c); }
.tbox h3 { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.tbox h3 .tname { font-family: var(--f-display); font-stretch: 75%; font-weight: 900; font-size: 46px; text-transform: uppercase; line-height: 1; display: inline-flex; align-items: center; gap: 12px; }
.tbox h3 .tname i { width: 26px; height: 26px; border-radius: 8px; background: var(--c); display: inline-block; }
.tbox h3 .tmeta { font-weight: 800; font-size: 20px; color: var(--muted); white-space: nowrap; }
.names { display: grid; gap: 8px; }
.name { height: 58px; border-radius: 14px; padding: 0 8px 0 10px; background: var(--surface); font-weight: 800; font-size: 34px; display: flex; align-items: center; gap: 12px;
  box-shadow: 0 1px 0 rgba(20,26,51,.06), 0 6px 14px -10px rgba(20,26,51,.4); }
.name b { width: 36px; height: 36px; border-radius: 10px; background: var(--c); color: #141A33; font-size: 18px; display: grid; place-items: center; flex-shrink: 0; }
.name span { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.name .x { border: 0; width: 38px; height: 38px; border-radius: 10px; background: var(--surface-2); font-size: 22px; font-weight: 900; line-height: 1; color: var(--muted); flex-shrink: 0; }
.name .x:hover { background: var(--danger); color: #fff; }
.name.off { background: transparent; box-shadow: inset 0 0 0 2px var(--line); color: var(--muted); }
.name.off span { text-decoration: line-through; }
.name.off b { background: var(--line); }
.name.off .x:hover { background: var(--share); }
.shuffling .name { animation: jiggle .12s ease-in-out infinite alternate; }
@keyframes jiggle { from { transform: translateY(-2px) rotate(-.6deg); } to { transform: translateY(2px) rotate(.6deg); } }
.fair { display: flex; align-items: center; gap: 12px; font-size: 18px; font-weight: 700; color: var(--muted); }
.fair b { color: var(--ink); }
.fair .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--share); flex-shrink: 0; }
.seg { display: inline-flex; align-items: center; background: var(--surface); border-radius: 14px; padding: 5px 5px 5px 16px; gap: 6px; box-shadow: var(--shadow); font-weight: 800; font-size: 18px; }
.seg button { border: 0; border-radius: 10px; width: 38px; height: 38px; font-weight: 900; font-size: 20px; background: var(--surface-2); }
.seg output { min-width: 34px; text-align: center; font-family: var(--f-display); font-stretch: 75%; font-weight: 900; font-size: 30px; }

/* ---------- question slide ---------- */
.stage { flex: 1; display: grid; grid-template-columns: 1fr 520px; gap: 26px; min-height: 0; }
.qcard { padding: 44px 50px; display: flex; flex-direction: column; gap: 26px; min-height: 0; overflow: hidden; position: relative; }
.qtop { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.tag { display: inline-flex; align-items: center; gap: 10px; padding: 8px 18px; border-radius: 999px; font-weight: 800; font-size: 21px; background: var(--surface-2); }
.tag i { width: 14px; height: 14px; border-radius: 50%; background: var(--pc); }
.question { font-family: var(--f-display); font-stretch: 85%; font-weight: 800; font-size: 72px; line-height: 1.02; letter-spacing: -.01em; text-wrap: balance; }
.question.long { font-size: 62px; }
.cue { background: var(--surface-2); border-radius: 18px; padding: 18px 24px; }
.cue ul { margin: 8px 0 0; padding-left: 28px; font-size: 30px; font-weight: 600; display: grid; gap: 4px; }
.lang { display: grid; gap: 10px; margin-top: auto; }
.lang ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.lang li { font-size: 28px; font-weight: 600; padding-left: 18px; border-left: 5px solid var(--line); }
.lang li em { color: var(--accent); font-style: normal; font-weight: 800; }
/* face-down question card */
.qcard.facedown { justify-content: center; align-items: center; text-align: center;
  background: repeating-linear-gradient(135deg, var(--surface) 0 26px, var(--surface-2) 26px 52px); }
.qcard.facedown .qbig { font-family: var(--f-display); font-stretch: 75%; font-weight: 900; font-size: 260px; line-height: .8; color: var(--accent); text-shadow: 0 10px 0 var(--surface-2); }
.qcard.facedown .question { font-size: 56px; max-width: 900px; }
.qcard.facedown .deckleft { font-weight: 800; font-size: 20px; color: var(--muted); }
.qcard.rolling .question { color: var(--muted); filter: blur(.6px); }
.qcard.landed { animation: land .5s cubic-bezier(.2,.9,.3,1.25); }
@keyframes land { from { transform: scale(.94) rotate(-.8deg); } }

.console { padding: 24px; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
.console > * { flex-shrink: 0; }
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.step { border: 0; border-radius: 14px; padding: 10px 6px; font-weight: 800; font-size: 23px; background: var(--surface-2); color: var(--muted); text-align: center; }
.step small { display: block; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; }
.step.on { background: var(--pc); color: #141A33; } .step.past { color: var(--ink); }
.step[disabled] { cursor: default; }
.ringwrap { position: relative; display: grid; place-items: center; }
.ringwrap svg { width: 300px; height: 300px; display: block; }
.ring-bg { fill: none; stroke: var(--surface-2); stroke-width: 20; }
.ring { fill: none; stroke: var(--pc); stroke-width: 20; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dashoffset .95s linear; }
.ringtext { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.time { font-family: var(--f-display); font-stretch: 75%; font-weight: 900; font-size: 112px; line-height: 1; font-variant-numeric: tabular-nums; }
.ringwrap.urgent .time { color: var(--danger); animation: pulse .5s ease-in-out infinite alternate; }
.ringwrap.urgent .ring { stroke: var(--danger); }
@keyframes pulse { to { transform: scale(1.06); } }
.instr { font-size: 23px; font-weight: 600; background: var(--surface-2); border-radius: 16px; padding: 14px 18px; line-height: 1.3; }
.instr b { color: var(--accent); }

.ticket { border-radius: 20px; background: var(--surface-2); padding: 12px 22px; text-align: center; position: relative; overflow: hidden; }
.ticket::before, .ticket::after { content: ""; position: absolute; top: 50%; width: 32px; height: 32px; border-radius: 50%; background: var(--surface); transform: translateY(-50%); }
.ticket::before { left: -16px; } .ticket::after { right: -16px; }
.ticket .who { font-family: var(--f-display); font-stretch: 80%; font-weight: 900; font-size: 72px; white-space: nowrap; line-height: 1; text-transform: uppercase; }
.ticket .teamline { display: inline-block; margin-top: 6px; padding: 5px 16px; border-radius: 999px; background: var(--c); color: #141A33; font-weight: 800; font-size: 20px; }
.hint { font-size: 17px; color: var(--muted); font-weight: 700; }
.adjust summary { cursor: pointer; font-weight: 800; color: var(--muted); font-size: 18px; }
.adj { display: inline-flex; align-items: center; gap: 6px; padding: 5px 6px 5px 14px; border-radius: 12px; background: var(--soft); font-weight: 800; font-size: 18px; }
.adj button { border: 0; border-radius: 9px; background: var(--surface); padding: 5px 12px; font-weight: 900; }
.score-row { display: flex; gap: 10px; }
.score-row .btn.team { flex: 0 0 92px; min-width: 0; padding: 14px 0; font-size: 30px; }
.score-row .btn.bonus { flex: 1; font-size: 22px; padding: 14px 10px; }
.btn.bonus { background: linear-gradient(135deg, var(--g1), var(--g2)); color: #fff; box-shadow: 0 8px 20px -10px var(--g1); }

/* ---------- twist cards ---------- */
.tw { perspective: 1200px; }
.twc { position: relative; overflow: hidden; border-radius: 22px; color: #fff; isolation: isolate;
  background: radial-gradient(120% 140% at 100% 0%, rgba(255,255,255,.28), transparent 45%), linear-gradient(135deg, var(--g1), var(--g2));
  box-shadow: inset 0 0 0 2px rgba(255,255,255,.28), inset 0 -10px 24px -10px rgba(0,0,0,.35), 0 18px 40px -16px var(--g2);
  display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; padding: 12px 16px; transform-style: preserve-3d; }
.twc::before { content: ""; position: absolute; inset: 0; z-index: -1; opacity: .22;
  background-image: radial-gradient(circle at 20% 30%, #fff 1.5px, transparent 2px), radial-gradient(circle at 70% 70%, #fff 1px, transparent 1.5px), radial-gradient(circle at 85% 20%, #fff 1.5px, transparent 2px);
  background-size: 60px 60px, 44px 44px, 80px 80px; }
.twc::after { content: ""; position: absolute; inset: -40% -60%; z-index: 1; pointer-events: none;
  background: linear-gradient(105deg, transparent 42%, rgba(255,255,255,.55) 50%, transparent 58%); transform: translateX(-70%);
  animation: sheen 3.2s ease-in-out 1s infinite; }
@keyframes sheen { 0% { transform: translateX(-70%); } 45%, 100% { transform: translateX(70%); } }
.twc .ico { width: 62px; height: 62px; border-radius: 20px; display: grid; place-items: center; font-size: 40px; line-height: 1;
  background: rgba(255,255,255,.2); box-shadow: inset 0 0 0 2px rgba(255,255,255,.35); }
.twc .k { font-size: 13px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; opacity: .85; display: flex; justify-content: space-between; gap: 10px; }
.twc .k em { font-style: normal; background: rgba(0,0,0,.22); border-radius: 999px; padding: 2px 10px; letter-spacing: .08em; }
.twc h4 { margin: 2px 0 2px; font-family: var(--f-display); font-stretch: 75%; font-weight: 900; font-size: 32px; line-height: 1; text-transform: uppercase; text-shadow: 0 2px 0 rgba(0,0,0,.18); }
.twc p { margin: 0; font-size: 17px; font-weight: 600; line-height: 1.3; }
.twc.flip { animation: flipin .9s cubic-bezier(.2,.9,.3,1.15) both; }
@keyframes flipin { 0% { transform: rotateY(180deg) scale(.7); opacity: 0; filter: brightness(2); } 55% { transform: rotateY(-14deg) scale(1.04); opacity: 1; } 100% { transform: none; filter: none; } }
.twc .mini-timer { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
.twc .mini-timer button { border: 0; border-radius: 10px; padding: 6px 14px; font-weight: 900; font-size: 16px; background: rgba(255,255,255,.92); color: #141A33; }
.twc .mini-timer output { font-family: var(--f-display); font-stretch: 75%; font-weight: 900; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
.twc .mini-timer output.low { animation: pulse .4s ease-in-out infinite alternate; }
/* gallery */
.twgrid { flex: 1; display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(2, 1fr); gap: 18px; min-height: 0; }
.twgrid .twc { grid-template-columns: 1fr; align-content: start; gap: 10px; padding: 22px 20px; animation: dealin .55s cubic-bezier(.2,.9,.3,1.2) both; }
.twgrid .twc .ico { width: 80px; height: 80px; font-size: 46px; }
.twgrid .twc h4 { font-size: 36px; }
.twgrid .twc p { font-size: 19px; }
.twgrid .twc:hover { transform: translateY(-6px) rotate(-1deg); transition: transform .2s; }
@keyframes dealin { from { transform: translateY(40px) rotate(6deg) scale(.9); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- final ---------- */
.final { align-items: center; text-align: center; justify-content: center; }
.final h2 { font-size: 150px; }
.podium { display: flex; justify-content: center; align-items: flex-end; gap: 22px; height: 420px; }
.pod { width: 260px; border-radius: 24px 24px 8px 8px; background: var(--c); color: #141A33; padding: 22px; display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; }
.pod .display { font-size: 40px; } .pod .n { font-family: var(--f-display); font-stretch: 75%; font-weight: 900; font-size: 90px; line-height: 1; }
.pod small { font-weight: 700; font-size: 16px; }
.confirm { background: var(--t0-soft); border-radius: 16px; padding: 14px 20px; font-weight: 700; font-size: 20px; display: flex; gap: 16px; align-items: center; justify-content: center; }

@keyframes rise { from { transform: translateY(16px) scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }
.rise { animation: rise .4s cubic-bezier(.2,.9,.3,1.3) both; }
@keyframes slidein { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: none; } }
.enter { animation: slidein .35s ease-out both; }
@keyframes bump { 40% { transform: scale(1.25); } }
.bump { animation: bump .4s ease-out; display: inline-block; }
@media (prefers-reduced-motion: reduce) { .rise, .enter, .bump, .ringwrap.urgent .time, .twc.flip, .twc::after, .twgrid .twc, .shuffling .name, .qcard.landed { animation: none !important; } .ring { transition: none; } }
</style>

</head>
<body>
<div id="viewport"><div id="deck"></div></div>

<script>
/* ===================== CONTENT (IELTS Speaking) ===================== */
const QUESTIONS = [
  { part:1, label:'Part 1 · Study', q:'What is your favourite subject? Why?',
    help:['My favourite subject is … <em>because</em> …','I find it … (interesting / useful / easy)','<em>For example</em>, …'] },
  { part:1, label:'Part 1 · Study', q:'Who is your favourite teacher?',
    help:['My favourite teacher is … who teaches …','I like him/her <em>because</em> he/she is … (patient / funny / kind)','He/She always …'] },
  { part:1, label:'Part 1 · Study', q:'Do you prefer studying in the morning or in the afternoon? Why?',
    help:['I prefer studying in the … <em>because</em> …','In the morning, my mind is …','<em>However</em>, sometimes I …'] },
  { part:1, label:'Part 1 · Study', q:'Do you usually study alone or with others?',
    help:['I usually study … <em>because</em> …','Studying with others helps me …','<em>But</em> when I have a test, I …'] },
  { part:1, label:'Part 1 · Study', q:'Do you think studying is important? Why?',
    help:['Yes, I think studying is important <em>because</em> …','It helps us …','In the future, …'] },
  { part:2, label:'Part 2 · Long turn', q:'Describe a person who is good at learning languages.',

const STUDENTS = ['Anna','Harry','Alan','Hannah','Serena','Alma','Thomas','Henry','Jay','Tina','Rider','Danny','Dragon','Berit','Jimmy','Lee','Benny','Lina','Linda'];
const TEAMS = [

const DEFAULT_ROUNDS = 8;
const PART_COLOR = { 1:'var(--t3)', 2:'var(--t1)', 3:'var(--t0)' };
/* Twist cards. type: mult = points ×n · bonus = +1 if they do it · free = free +1 · steal = other teams can steal · none */
const TWISTS = [
  { key:'double',  ico:'🔥', title:'Double points', text:'Points for this answer count ×2.', type:'mult', g1:'#FF6B57', g2:'#C81E3A', tag:'×2' },

/* ===================== FAIR RANDOM ===================== */
/* Unbiased integer in [0, n) from the browser's cryptographic RNG (rejection sampling, no modulo bias). */
function randInt(n){
  if(n<=1) return 0;
  const c = window.crypto || window.msCrypto;
  if(!c || !c.getRandomValues) return Math.floor(Math.random()*n);
  const lim = Math.floor(0x100000000 / n) * n, a = new Uint32Array(1);
  do { c.getRandomValues(a); } while(a[0] >= lim);
  return a[0] % n;
}
/* Fisher–Yates shuffle: every order is equally likely. */
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=randInt(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ===================== STATE ===================== */
/* Deal students into 3 teams: shuffle present students, then deal round-robin from a random team.
   Team sizes differ by at most 1 and which team gets the extra player is random too. */
function deal(absent){
  const present = shuffle(STUDENTS.filter(s=>!absent.includes(s)));
  const away = shuffle(STUDENTS.filter(s=>absent.includes(s)));
  const tOrder = shuffle([0,1,2]), order=[...present, ...away], teamOf={};
  order.forEach((s,i)=>teamOf[s]=tOrder[i%3]);
  return { order, teamOf };
}
function freshGame(){ return { scores:[0,0,0], turns:[0,0,0], drawn:{}, teamBag:[], stuBag:{0:[],1:[],2:[]}, twistBag:[] }; }
function defaultState(){
  return Object.assign({ slide:0, teamCount:3, phase:'draw', timeLeft:0, total:0, running:false,
    picked:null, pickTeam:null, twist:null, bonusDone:false, rounds:DEFAULT_ROUNDS, confirm:null, absent:[] }, deal([]), freshGame());
}
function load(){ try{ const r=localStorage.getItem(KEY); return r?JSON.parse(r):null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify({...S, running:false, confirm:null})); }catch(e){} }
let S = Object.assign(defaultState(), load()||{}); S.running=false; S.confirm=null;

/* slides: 0 title, 1 rules, 2 teams, 3 twist cards, 4.. questions, last final */
const Q0 = 4;
const slideCount = () => Q0 + S.rounds + 1;
const kind = i => i===0?'title':i===1?'rules':i===2?'teams':i===3?'twists':i===slideCount()-1?'final':'question';
const roundNo = () => S.slide-Q0;
const curQ = () => { const d=S.drawn[roundNo()]; return d==null?null:QUESTIONS[d]; };

/* ===================== SOUND ===================== */
let actx=null;
function beep(f=880,d=.16,n=1){ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)();
  for(let i=0;i<n;i++){ const o=actx.createOscillator(), g=actx.createGain(); o.type='triangle'; o.frequency.value=f;
    o.connect(g); g.connect(actx.destination); const t=actx.currentTime+i*(d+.07);
    g.gain.setValueAtTime(.15,t); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.start(t); o.stop(t+d); } }catch(e){} }

/* ===================== HELPERS ===================== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];

/* ===================== SCALE TO FIT ===================== */

/* ===================== TIMER ===================== */
let tick=null; const CIRC=2*Math.PI*130;
function startTimer(){ if(S.timeLeft<=0) return; S.running=true; clearInterval(tick);
  tick=setInterval(()=>{ S.timeLeft--; if(S.timeLeft<=5&&S.timeLeft>0) beep(660,.07);
    if(S.timeLeft<=0){ S.timeLeft=0; S.running=false; clearInterval(tick); beep(988,.25,3); }
    paintTimer(); save(); },1000);
  paintTimer(); }
function pauseTimer(){ S.running=false; clearInterval(tick); paintTimer(); save(); }
function paintTimer(){
  const t=$('#time'); if(!t) return;
  t.textContent=fmt(S.timeLeft);
  $('#tsub').textContent = S.timeLeft===0 ? "Time's up" : S.running ? 'Thinking…' : 'Paused';
  $('#ring').style.strokeDashoffset = CIRC*(1-(S.total?S.timeLeft/S.total:0));
  $('#ringwrap').classList.toggle('urgent', S.timeLeft<=5&&S.timeLeft>0&&S.running);

}

/* ===================== NAVIGATION (PowerPoint-like) ===================== */
function setPhase(p){ pauseTimer(); stopSpeed(); S.phase=p; if(p==='think'){ S.timeLeft=S.total=THINK; } save(); render(); }
function goSlide(i, phase){
  if(busy) return;
  pauseTimer(); stopSpeed(); S.slide=Math.max(0,Math.min(slideCount()-1,i)); S.picked=null; S.pickTeam=null; S.twist=null; S.bonusDone=false; S.confirm=null;
  if(kind(S.slide)==='question'){ S.phase = curQ() ? (phase||'think') : 'draw'; S.timeLeft=S.total=THINK; }
  save(); render(true);
  if(kind(S.slide)==='final') beep(659,.15,4);
}
function next(){
  if(busy) return;
  if(kind(S.slide)==='question'){
    if(S.phase==='draw') return curQ() ? (setPhase('think'), startTimer()) : drawQuestion();

  }
  if(S.slide<slideCount()-1) goSlide(S.slide+1);
}

  if(busy) return;

function render(animate){
  const k=kind(S.slide);
  const html = k==='title'?titleSlide(): k==='rules'?rulesSlide(): k==='teams'?teamsSlide(): k==='twists'?twistsSlide(): k==='final'?finalSlide(): questionSlide();
  $('#deck').innerHTML = html + bar();
  if(animate){ const s=$('.slide'); s.classList.add('enter'); }
  S.twistFresh=false;
  bind();
}

/* ===================== ACTIONS ===================== */
function drawQuestion(redraw){
  if(busy) return;
  const r=roundNo(), cur=S.drawn[r];
  const used=Object.entries(S.drawn).filter(([k])=>+k!==r && +k<S.rounds).map(([,v])=>v);
  let avail=QUESTIONS.map((_,i)=>i).filter(i=>!used.includes(i) && i!==cur);
  if(!avail.length) avail=QUESTIONS.map((_,i)=>i).filter(i=>i!==cur);
  const final=avail[randInt(avail.length)];
  pauseTimer();
  if(redraw){ delete S.drawn[r]; S.phase='draw'; render(); }
  busy=true; $$('#draw').forEach(b=>b.disabled=true);
  const card=$('#qcard'), txt=$('#qtext'), big=$('#qbig'); card.classList.add('rolling');
  let i=0;
  (function roll(){
    const q=QUESTIONS[randInt(QUESTIONS.length)];
    txt.textContent=q.q; big.textContent=['?','!','?','★'][i%4]; beep(420+randInt(300),.03); i++;
    if(i<18) setTimeout(roll, 40+i*i*.5);
    else { busy=false; S.drawn[r]=final; S.justDrawn=true; S.phase='think'; S.timeLeft=S.total=THINK;
      beep(1046,.18,2); save(); render(); startTimer(); }
  })();
}

/* Team turns come from a shuffled "bag" of teams: each team speaks once before any team speaks twice.
   Inside a team, students come from their own shuffled bag: everyone speaks once before anyone repeats. */
function nextTeam(){
  const live=teamIdx().filter(t=>members(t).length);
  S.teamBag=(S.teamBag||[]).filter(t=>live.includes(t));
  if(!S.teamBag.length) S.teamBag=shuffle(live);
  return S.teamBag.pop();
}
function nextStudent(t){
  const m=members(t);
  let bag=(S.stuBag[t]||[]).filter(s=>m.includes(s));
  if(!bag.length) bag=shuffle(m);
  const s=bag.pop(); S.stuBag[t]=bag; return s;
}
function nextTwist(){
  if(!S.twistBag||!S.twistBag.length) S.twistBag=shuffle([...TWISTS.map(t=>t.key), ...Array(BLANKS).fill(null)]);
  return S.twistBag.pop();
}
function spin(){
  if(busy) return;
  const repick = !!S.picked;
  let t, final;
  if(repick && members(S.pickTeam).length){
    t=S.pickTeam; const bag=(S.stuBag[t]||[]).filter(s=>s!==S.picked);
    if(members(t).includes(S.picked)) bag.unshift(S.picked);   // skipped student goes to the bottom of the bag
    S.stuBag[t]=bag; final=nextStudent(t);
  } else {
    if(!teamIdx().some(x=>members(x).length)) return;
    t=nextTeam(); final=nextStudent(t); S.turns[t]=(S.turns[t]||0)+1;
    S.twist=nextTwist();
  }
  stopSpeed(); busy=true; $$('#spin').forEach(b=>b.disabled=true);
  const keepTwist=S.twist; S.picked=null; S.pickTeam=t; S.bonusDone=false; S.twist=null;
  render();
  const el=$('#who'), tl=$('#whoteam'), pool=STUDENTS.filter(s=>!isAbsent(s)); el.classList.remove('rise'); let i=0;
  (function roll(){
    const s=pool[randInt(pool.length)]; el.textContent=s;
    tl.style.visibility='visible'; tl.textContent=TEAMS[S.teamOf[s]].name; tl.style.setProperty('--c',TEAMS[S.teamOf[s]].c);
    beep(380+randInt(320),.035); i++;
    if(i<20) setTimeout(roll, 35+i*i*.45);
    else { busy=false; S.picked=final; S.twist=keepTwist; S.twistFresh=!!keepTwist;
      beep(1046,.18,2); if(keepTwist) setTimeout(()=>beep(1318,.12,3),350); save(); render(); }
  })();
}
function addScore(t,n){ S.scores[t]=Math.max(0,S.scores[t]+n); save(); render();
  const el=$('#score-'+t); if(el) el.classList.add('bump'); if(n>0) beep(784,.12); }
function doShuffle(){
  if(busy) return; busy=true; S.confirm=null; let i=0;
  (function frame(){
    Object.assign(S, deal(S.absent||[])); render(); $('#tg').classList.add('shuffling'); beep(500+randInt(400),.03); i++;
    if(i<12) setTimeout(frame, 60+i*12);
    else { busy=false; Object.assign(S, deal(S.absent||[]), freshGame()); save(); render();
      $$('.name').forEach((n,k)=>{ n.classList.add('rise'); n.style.animationDelay=(k%7)*.04+'s'; }); beep(988,.15,2); }
  })();
}
function toggleFS(){ try{ if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{}); else document.exitFullscreen().catch(()=>{}); }catch(e){} }
function setRounds(n){ S.rounds=Math.max(1,Math.min(15,n)); Object.keys(S.drawn).forEach(k=>{ if(+k>=S.rounds) delete S.drawn[k]; }); save(); render(); }

function bind(){
  $('#prev').onclick=prev; $('#next').onclick=next; $('#fs').onclick=toggleFS;
  $('#toTeams').onclick=()=>goSlide(2);
  $$('[data-absent]').forEach(b=>b.onclick=()=>{ S.absent=[...(S.absent||[]), b.dataset.absent]; save(); render(); });
  $$('[data-back]').forEach(b=>b.onclick=()=>{ S.absent=(S.absent||[]).filter(x=>x!==b.dataset.back); save(); render(); });
  const anyScore=()=>S.scores.some(x=>x>0)||S.turns.some(x=>x>0);
  const sh=$('#shuffle'); if(sh) sh.onclick=()=>{ if(anyScore()){ S.confirm='shuffle'; render(); } else doShuffle(); };
  const rs=$('#reset'); if(rs) rs.onclick=()=>{ S.confirm='reset'; render(); };
  const cy=$('#confirmYes'); if(cy) cy.onclick=()=>{ if(S.confirm==='shuffle') return doShuffle();
    Object.assign(S, freshGame()); S.confirm=null; save(); render(); };
  const cn=$('#confirmNo'); if(cn) cn.onclick=()=>{ S.confirm=null; render(); };
  const rm=$('#rMinus'); if(rm) rm.onclick=()=>setRounds(S.rounds-1);
  const rp=$('#rPlus'); if(rp) rp.onclick=()=>setRounds(S.rounds+1);
  const dr=$('#draw'); if(dr) dr.onclick=()=>drawQuestion();
  const rd=$('#redraw'); if(rd) rd.onclick=()=>drawQuestion(true);
  $$('[data-phase]').forEach(b=>b.onclick=()=>{ setPhase(b.dataset.phase); });
  const pp=$('#playpause'); if(pp) pp.onclick=()=>S.running?pauseTimer():startTimer();
  const p30=$('#plus30'); if(p30) p30.onclick=()=>{ S.timeLeft+=30; S.total=Math.max(S.total,S.timeLeft); paintTimer(); save(); };
  $$('#spin').forEach(b=>b.onclick=spin);
  $$('[data-score]').forEach(b=>b.onclick=()=>addScore(+b.dataset.team,+b.dataset.score));
  const bo=$('#bonus'); if(bo) bo.onclick=()=>{ S.bonusDone=true; addScore(+bo.dataset.team,1); };
  const sp=$('#spBtn'); if(sp) sp.onclick=()=>{
    if(spTick){ stopSpeed(); sp.textContent='Start 20s'; return; }
    const tw=TWISTS.find(x=>x.key===S.twist); spLeft=tw.timer; sp.textContent='Stop';
    spTick=setInterval(()=>{ spLeft--; const o=$('#spOut'); if(o){ o.textContent=spLeft; o.classList.toggle('low', spLeft<=5); }
      if(spLeft<=5&&spLeft>0) beep(660,.06);
      if(spLeft<=0){ stopSpeed(); beep(988,.25,3); const b=$('#spBtn'); if(b) b.textContent='Start 20s'; } },1000);
  };
}

document.addEventListener('keydown',e=>{
  const k=e.key;
  if(k==='ArrowRight'||k==='PageDown'||k==='Enter'&&!e.target.closest('button')){ e.preventDefault(); next(); }
  else if(k==='ArrowLeft'||k==='PageUp'){ e.preventDefault(); prev(); }
  else if(e.code==='Space'){ if(kind(S.slide)==='question'&&S.phase==='think'){ e.preventDefault(); S.running?pauseTimer():startTimer(); } }
  else if(k==='p'||k==='P'){ const b=$('#spin'); if(b&&!b.disabled) b.click(); }
  else if(k==='f'||k==='F'){ toggleFS(); }
  else if(k==='Home'){ goSlide(0); }
});

if(S.slide>=slideCount()) S.slide=0;
if(kind(S.slide)==='question'){ if(!curQ()) S.phase='draw'; else if(S.phase==='draw') S.phase='think'; if(!S.total){ S.timeLeft=S.total=THINK; } }
render(); fit();
</script>
