<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Row Battle Speaking</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: a 1600×900 slide canvas scaled to fit the screen (letterboxed), like a PowerPoint show.
   → / PageDown / clicker advances step-by-step (Think → Pair → Share → next slide). */
:root {
  --bg: #E9EEF5; --frame: #D5DCE8;
  --surface: #FFFFFF; --surface-2: #F1F4F9;
  --ink: #141A33; --muted: #5A6283; --line: #CBD3E3;
  --accent: #2F4BFF; --accent-ink: #FFFFFF;
  --t0: #FF6B57; --t0-soft: #FFE3DE;
  --t1: #F5B21B; --t1-soft: #FFF1CC;
  --t2: #14A88F; --t2-soft: #D3F3EC;
  --t3: #7C6CF2; --t3-soft: #E6E2FF;
  --think: #F5B21B; --pair: #FF6B57; --share: #14A88F; --danger: #E5383B;
  --shadow: 0 1px 0 rgba(20,26,51,.06), 0 14px 36px -14px rgba(20,26,51,.28);
  --f-display: 'Archivo', 'Arial Narrow', Arial, sans-serif;
  --f-body: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#0F1326; --frame:#080B18; --surface:#191E37; --surface-2:#232A50; --ink:#EEF1FF; --muted:#A3AACB; --line:#2E3560;
  --accent:#6E83FF; --accent-ink:#0F1326;
  --t0-soft:#3A2230; --t1-soft:#3A3120; --t2-soft:#163A3A; --t3-soft:#2B2756;
  --shadow: 0 1px 0 rgba(0,0,0,.3), 0 14px 36px -14px rgba(0,0,0,.6); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg:#0F1326; --frame:#080B18; --surface:#191E37; --surface-2:#232A50; --ink:#EEF1FF; --muted:#A3AACB; --line:#2E3560;
  --accent:#6E83FF; --accent-ink:#0F1326;
  --t0-soft:#3A2230; --t1-soft:#3A3120; --t2-soft:#163A3A; --t3-soft:#2B2756;
  --shadow: 0 1px 0 rgba(0,0,0,.3), 0 14px 36px -14px rgba(0,0,0,.6); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--frame); color: var(--ink); font-family: var(--f-body); overflow: hidden;
  padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
#viewport { position: relative; width: 100%; height: 100%; display: grid; place-items: center; overflow: hidden; }
#deck { width: 1600px; height: 900px; position: absolute; left: 50%; top: 50%; transform-origin: 0 0;
  background: var(--bg); overflow: hidden; border-radius: 6px; }
.slide { position: absolute; inset: 0; padding: 56px 72px 92px; display: flex; flex-direction: column; gap: 28px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, summary:focus-visible { outline: 4px solid var(--accent); outline-offset: 3px; }
h1,h2,h3,p { margin: 0; }
.display { font-family: var(--f-display); font-stretch: 75%; font-weight: 900; text-transform: uppercase; line-height: .92; letter-spacing: -.01em; }
.eyebrow { font-size: 18px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.panel { background: var(--surface); border-radius: 26px; box-shadow: var(--shadow); }
.row { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }

/* bottom bar */
.bar { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; display: flex; align-items: center; gap: 16px; padding: 0 28px; z-index: 5; }
.bar .prog { flex: 1; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar .prog i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
.bar .count { font-weight: 800; font-size: 17px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 70px; text-align: center; }
.nav { border: 0; width: 46px; height: 46px; border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); font-size: 22px; font-weight: 900; display: grid; place-items: center; }
.nav[disabled] { opacity: .3; pointer-events: none; }
.barbtn { border: 0; border-radius: 12px; height: 46px; padding: 0 16px; background: var(--surface); box-shadow: var(--shadow); font-weight: 800; font-size: 16px; }
.keys { font-size: 15px; color: var(--muted); font-weight: 600; }

/* buttons */
.btn { border: 0; border-radius: 16px; padding: 16px 26px; font-weight: 800; font-size: 24px; background: var(--surface-2); color: var(--ink); box-shadow: inset 0 0 0 2px var(--line); transition: transform .08s, filter .15s; }
.btn:hover { filter: brightness(.97); } .btn:active { transform: translateY(2px); }
.btn.primary { background: var(--accent); color: var(--accent-ink); box-shadow: none; }
.btn.team { background: var(--c); color: #141A33; box-shadow: none; font-size: 32px; min-width: 100px; }
.btn.sm { font-size: 18px; padding: 10px 16px; border-radius: 12px; }
.btn[disabled] { opacity: .35; pointer-events: none; }

/* score strip */
.scores { display: flex; gap: 14px; }
.score { min-width: 170px; padding: 12px 20px 12px 26px; border-radius: 18px; background: var(--surface); box-shadow: var(--shadow); position: relative; overflow: hidden;
  display: grid; grid-template-columns: 1fr auto; align-items: center; column-gap: 14px; }
.score::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 10px; background: var(--c); }
.score .tn { font-weight: 800; font-size: 20px; }
.score .lead { font-size: 14px; font-weight: 800; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; }
.score .num { font-family: var(--f-display); font-stretch: 75%; font-weight: 900; font-size: 60px; line-height: 1; grid-row: span 2; font-variant-numeric: tabular-nums; }
.score.leader { background: var(--soft); }
.head { display: flex; justify-content: space-between; align-items: center; gap: 24px; }
.head h1 { font-size: 64px; } .head h1 span { color: var(--accent); }

/* ---------- title slide ---------- */
.title-slide { justify-content: center; padding-left: 120px; }
.title-slide .big { font-size: 250px; line-height: .82; }
.title-slide .big span { color: var(--accent); display: block; }
.title-slide .sub { font-size: 34px; font-weight: 700; max-width: 900px; color: var(--muted); }
.title-slide .sub b { color: var(--ink); }
.blocks { position: absolute; right: 100px; top: 50%; transform: translateY(-58%); display: grid; grid-template-columns: 420px; gap: 20px; }
.blocks div { height: 150px; border-radius: 28px; background: var(--c); display: flex; align-items: center; justify-content: space-between; padding: 0 34px; font-family: var(--f-display); font-stretch: 75%; font-weight: 900; font-size: 64px; text-transform: uppercase; color: #141A33; }
.blocks div span { font-size: 22px; font-weight: 800; letter-spacing: .12em; opacity: .7; }

/* ---------- rules slide ---------- */
.rules { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; flex: 1; }
.rule { padding: 30px; display: flex; flex-direction: column; gap: 14px; }
.rule .n { font-family: var(--f-display); font-stretch: 75%; font-weight: 900; font-size: 64px; line-height: 1; color: var(--c, var(--accent)); }
.rule h3 { font-size: 32px; font-weight: 800; }
.rule p { font-size: 23px; font-weight: 500; line-height: 1.35; color: var(--muted); }
.rule p b { color: var(--ink); }
.pts { display: flex; flex-wrap: wrap; gap: 8px; }
.pts span { background: var(--surface-2); border-radius: 10px; padding: 6px 12px; font-weight: 800; font-size: 19px; }

/* ---------- teams slide ---------- */
.teamsgrid { display: grid; grid-template-columns: repeat(var(--cols), 1fr); gap: 20px; }
.tbox { border-radius: 24px; background: var(--soft); padding: 22px; display: flex; flex-direction: column; gap: 14px; min-height: 300px; }
.tbox h3 { display: flex; justify-content: space-between; align-items: center; font-size: 26px; font-weight: 800; }
.tbox h3 i { width: 22px; height: 22px; border-radius: 7px; background: var(--c); display: inline-block; margin-right: 10px; vertical-align: -3px; }
.names { display: flex; flex-wrap: wrap; gap: 8px; }
.name { border-radius: 10px; padding: 6px 6px 6px 10px; background: var(--surface); font-weight: 800; font-size: 22px; display: inline-flex; align-items: center; gap: 8px; }
.name b { font-size: 14px; color: var(--muted); min-width: 16px; }
.name .x { border: 0; width: 30px; height: 30px; border-radius: 8px; background: var(--surface-2); font-size: 20px; font-weight: 900; line-height: 1; color: var(--muted); }
.name .x:hover { background: var(--danger); color: #fff; }
.name.off { background: transparent; box-shadow: inset 0 0 0 2px var(--line); color: var(--muted); text-decoration: line-through; }
.name.off .x { text-decoration: none; }
.name.off .x:hover { background: var(--share); }
.seg { display: inline-flex; background: var(--surface); border-radius: 14px; padding: 5px; gap: 4px; box-shadow: var(--shadow); }
.seg button { border: 0; border-radius: 10px; padding: 10px 18px; font-weight: 800; font-size: 18px; background: transparent; }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.qpick { display: flex; flex-wrap: wrap; gap: 8px; }
.qpick button { border: 0; border-radius: 10px; padding: 8px 12px; font-weight: 800; font-size: 17px; background: var(--surface); color: var(--muted); text-decoration: line-through; }
.qpick button.in { background: var(--pc); color: #141A33; text-decoration: none; }

/* ---------- question slide ---------- */
.stage { flex: 1; display: grid; grid-template-columns: 1fr 520px; gap: 26px; min-height: 0; }
.qcard { padding: 44px 50px; display: flex; flex-direction: column; gap: 26px; min-height: 0; overflow: hidden; }
.qtop { display: flex; justify-content: space-between; align-items: center; }
.tag { display: inline-flex; align-items: center; gap: 10px; padding: 8px 18px; border-radius: 999px; font-weight: 800; font-size: 21px; background: var(--surface-2); }
.tag i { width: 14px; height: 14px; border-radius: 50%; background: var(--pc); }
.question { font-family: var(--f-display); font-stretch: 85%; font-weight: 800; font-size: 72px; line-height: 1.02; letter-spacing: -.01em; text-wrap: balance; }
.question.long { font-size: 62px; }
.cue { background: var(--surface-2); border-radius: 18px; padding: 18px 24px; }
.cue ul { margin: 8px 0 0; padding-left: 28px; font-size: 30px; font-weight: 600; display: grid; gap: 4px; }
.lang { display: grid; gap: 10px; margin-top: auto; }
.lang ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.lang li { font-size: 28px; font-weight: 600; padding-left: 18px; border-left: 5px solid var(--line); }
.lang li em { color: var(--accent); font-style: normal; font-weight: 800; }

.console { padding: 26px; display: flex; flex-direction: column; gap: 16px; min-height: 0; }
.console > * { flex-shrink: 0; }
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.step { border: 0; border-radius: 14px; padding: 12px 6px; font-weight: 800; font-size: 24px; background: var(--surface-2); color: var(--muted); text-align: center; }
.step small { display: block; font-size: 14px; letter-spacing: .1em; text-transform: uppercase; }
.step.on { background: var(--pc); color: #141A33; } .step.past { color: var(--ink); }
.ringwrap { position: relative; display: grid; place-items: center; }
.ringwrap svg { width: 300px; height: 300px; display: block; }
.ring-bg { fill: none; stroke: var(--surface-2); stroke-width: 20; }
.ring { fill: none; stroke: var(--pc); stroke-width: 20; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dashoffset .95s linear; }
.ringtext { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.time { font-family: var(--f-display); font-stretch: 75%; font-weight: 900; font-size: 112px; line-height: 1; font-variant-numeric: tabular-nums; }
.ringwrap.urgent .time { color: var(--danger); animation: pulse .5s ease-in-out infinite alternate; }
.ringwrap.urgent .ring { stroke: var(--danger); }
@keyframes pulse { to { transform: scale(1.06); } }
.instr { font-size: 23px; font-weight: 600; background: var(--surface-2); border-radius: 16px; padding: 14px 18px; line-height: 1.3; }
.instr b { color: var(--accent); }

.ticket { border-radius: 20px; background: var(--surface-2); padding: 22px; text-align: center; position: relative; overflow: hidden; }
.ticket::before, .ticket::after { content: ""; position: absolute; top: 50%; width: 32px; height: 32px; border-radius: 50%; background: var(--surface); transform: translateY(-50%); }
.ticket::before { left: -16px; } .ticket::after { right: -16px; }
.ticket .who { font-family: var(--f-display); font-stretch: 80%; font-weight: 900; font-size: 88px; white-space: nowrap; line-height: 1; text-transform: uppercase; }
.ticket .teamline { display: inline-block; margin-top: 8px; padding: 5px 16px; border-radius: 999px; background: var(--c); color: #141A33; font-weight: 800; font-size: 20px; }
.twist { border-radius: 18px; padding: 16px 20px; background: var(--ink); color: var(--bg); display: grid; gap: 4px; }
.twist .display { font-size: 38px; color: var(--t1); }
.twist p { font-weight: 600; font-size: 21px; }
.hint { font-size: 17px; color: var(--muted); font-weight: 700; }
.adjust summary { cursor: pointer; font-weight: 800; color: var(--muted); font-size: 18px; }
.adj { display: inline-flex; align-items: center; gap: 6px; padding: 5px 6px 5px 14px; border-radius: 12px; background: var(--soft); font-weight: 800; font-size: 18px; }
.adj button { border: 0; border-radius: 9px; background: var(--surface); padding: 5px 12px; font-weight: 900; }

/* ---------- final ---------- */
.final { align-items: center; text-align: center; justify-content: center; }
.final h2 { font-size: 150px; }
.podium { display: flex; justify-content: center; align-items: flex-end; gap: 22px; height: 420px; }
.pod { width: 260px; border-radius: 24px 24px 8px 8px; background: var(--c); color: #141A33; padding: 22px; display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; }
.pod .display { font-size: 40px; } .pod .n { font-family: var(--f-display); font-stretch: 75%; font-weight: 900; font-size: 90px; line-height: 1; }
.pod small { font-weight: 700; font-size: 16px; }
.confirm { background: var(--t0-soft); border-radius: 16px; padding: 14px 20px; font-weight: 700; font-size: 20px; display: grid; gap: 10px; justify-items: center; }

@keyframes rise { from { transform: translateY(16px) scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }
.rise { animation: rise .4s cubic-bezier(.2,.9,.3,1.3) both; }
@keyframes slidein { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: none; } }
.enter { animation: slidein .35s ease-out both; }
@keyframes bump { 40% { transform: scale(1.25); } }
.bump { animation: bump .4s ease-out; display: inline-block; }
@media (prefers-reduced-motion: reduce) { .rise, .enter, .bump, .ringwrap.urgent .time { animation: none !important; } .ring { transition: none; } }
</style>

</head>
<body>
<div id="viewport"><div id="deck"></div></div>

<script>
/* ===================== CONTENT (IELTS Speaking) ===================== */
const QUESTIONS = [
  { part:1, label:'Part 1 · Study', q:'What is your favourite subject? Why?',
    help:['My favourite subject is … <em>because</em> …','I find it … (interesting / useful / easy)','<em>For example</em>, …'], think:20, pair:90 },
  { part:1, label:'Part 1 · Study', q:'Who is your favourite teacher?',
    help:['My favourite teacher is … who teaches …','I like him/her <em>because</em> he/she is … (patient / funny / kind)','He/She always …'], think:20, pair:90 },
  { part:1, label:'Part 1 · Study', q:'Do you prefer studying in the morning or in the afternoon? Why?',
    help:['I prefer studying in the … <em>because</em> …','In the morning, my mind is …','<em>However</em>, sometimes I …'], think:20, pair:90 },
  { part:1, label:'Part 1 · Study', q:'Do you usually study alone or with others?',
    help:['I usually study … <em>because</em> …','Studying with others helps me …','<em>But</em> when I have a test, I …'], think:20, pair:90 },
  { part:1, label:'Part 1 · Study', q:'Do you think studying is important? Why?',
    help:['Yes, I think studying is important <em>because</em> …','It helps us …','In the future, …'], think:20, pair:90 },
  { part:2, label:'Part 2 · Long turn', q:'Describe a person who is good at learning languages.',
    cue:['Who it is','How you knew him/her','What languages he/she has learnt','And explain why you think he/she is good at learning languages'],
    help:['<em>I\'d like to talk about</em> …','I first met him/her when …','He/She can speak … and …','I think he/she is good at languages <em>because</em> …'], think:60, pair:240,
    pairNote:'Partner A speaks for <b>1–2 minutes</b>, then swap. The listener writes down <b>3 key ideas</b>.' },
  { part:3, label:'Part 3 · Discussion', q:'Why are some people better at learning languages than others?',
    help:['I think there are two main reasons. <em>First</em>, …','<em>Another reason is that</em> …','<em>For instance</em>, …'], think:30, pair:120 },
  { part:3, label:'Part 3 · Discussion', q:'Is it easier for children to learn languages?',
    help:['Yes / Not necessarily. <em>On the one hand</em>, …','<em>On the other hand</em>, adults …','<em>Overall</em>, I believe …'], think:30, pair:120 },
  { part:3, label:'Part 3 · Discussion', q:'What is the best way to learn a foreign language?',
    help:['<em>In my opinion</em>, the best way is to …','<em>This is because</em> …','<em>For example</em>, I …'], think:30, pair:120 },
  { part:3, label:'Part 3 · Discussion', q:'Why do people learn foreign languages?',
    help:['People learn foreign languages for many reasons, <em>such as</em> …','<em>Firstly</em>, … <em>Secondly</em>, …','Some people also …'], think:30, pair:120 },
  { part:3, label:'Part 3 · Discussion', q:'Should schools teach more foreign languages?',
    help:['I agree / disagree that …','<em>If</em> schools teach more languages, students will …','<em>However</em>, …'], think:30, pair:120 },
];
const STUDENTS = ['Anna','Harry','Alan','Hannah','Serena','Alma','Thomas','Henry','Jay','Tina','Rider','Danny','Dragon','Berit','Jimmy','Lee','Benny','Lina','Linda'];
const TEAMS = [
  { name:'Phoenix', c:'var(--t0)', soft:'var(--t0-soft)' },
  { name:'Thunder', c:'var(--t1)', soft:'var(--t1-soft)' },
  { name:'Kraken',  c:'var(--t2)', soft:'var(--t2-soft)' },
];
/* Fixed seating: Team 1 = 6, Team 2 = 6, Team 3 = 7 (list order) */
const TEAM_SIZES = [6,6,7];
const PART_COLOR = { 1:'var(--t3)', 2:'var(--t1)', 3:'var(--t0)' };
const TWISTS = [
  { key:'double', title:'Double points', text:'Points for this answer count ×2.' },
  { key:'help',   title:'Help line', text:'The speaker may ask ONE teammate for help.' },
  { key:'steal',  title:'Steal!', text:'Answer too short? Another team raises hands and steals the points.' },
  { key:'extend', title:'Why? Why? Why?', text:'The teacher asks one more "Why?" - answer it for +1 bonus.' },
];
const PHASES = ['think','pair','share'];
const PHASE = { think:{label:'Think', sub:'Alone', c:'var(--think)'}, pair:{label:'Pair', sub:'Partner', c:'var(--pair)'}, share:{label:'Share', sub:'Class', c:'var(--share)'} };
const PRESET = [0,2,3,5,6,7,8];
const KEY = 'rowbattle-ielts-fixed3';

/* ===================== STATE ===================== */
function defaultState(){
  const teamOf={}; STUDENTS.forEach((s,i)=>teamOf[s]= i<TEAM_SIZES[0]?0 : i<TEAM_SIZES[0]+TEAM_SIZES[1]?1 : 2);
  return { slide:0, teamCount:3, teamOf, scores:[0,0,0], phase:'think', timeLeft:0, total:0, running:false,
    picked:null, picks:[], twist:null, rounds:[...PRESET], confirm:false, absent:[] };
}
function load(){ try{ const r=localStorage.getItem(KEY); return r?JSON.parse(r):null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify({...S, running:false, confirm:false})); }catch(e){} }
let S = Object.assign(defaultState(), load()||{}); S.running=false;

/* slides: 0 title, 1 rules, 2 teams, 3.. questions, last final */
const Q0 = 3;
const slideCount = () => Q0 + S.rounds.length + 1;
const kind = i => i===0?'title':i===1?'rules':i===2?'teams':i===slideCount()-1?'final':'question';
const curQ = () => QUESTIONS[S.rounds[S.slide-Q0]];

/* ===================== SOUND ===================== */
let actx=null;
function beep(f=880,d=.16,n=1){ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)();
  for(let i=0;i<n;i++){ const o=actx.createOscillator(), g=actx.createGain(); o.type='triangle'; o.frequency.value=f;
    o.connect(g); g.connect(actx.destination); const t=actx.currentTime+i*(d+.07);
    g.gain.setValueAtTime(.15,t); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.start(t); o.stop(t+d); } }catch(e){} }

/* ===================== HELPERS ===================== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const roster=t=>STUDENTS.filter(s=>S.teamOf[s]===t);
const isAbsent=s=>(S.absent||[]).includes(s);
const members=t=>roster(t).filter(s=>!isAbsent(s));
const teamVars=t=>`--c:${TEAMS[t].c};--soft:${TEAMS[t].soft}`;
const teamIdx=()=>[...Array(S.teamCount).keys()];

/* ===================== SCALE TO FIT ===================== */
function fit(){
  const vw=window.innerWidth, vh=window.innerHeight, s=Math.min(vw/1600, vh/900);
  const d=$('#deck'); d.style.transform=`translate(${-800*s}px, ${-450*s}px) scale(${s})`;
}
window.addEventListener('resize', fit);

/* ===================== TIMER ===================== */
let tick=null; const CIRC=2*Math.PI*130;
function startTimer(){ if(S.timeLeft<=0) return; S.running=true; clearInterval(tick);
  tick=setInterval(()=>{ S.timeLeft--; if(S.timeLeft<=5&&S.timeLeft>0) beep(660,.07);
    if(S.timeLeft<=0){ S.timeLeft=0; S.running=false; clearInterval(tick); beep(988,.25,3); }
    paintTimer(); save(); },1000);
  paintTimer(); }
function pauseTimer(){ S.running=false; clearInterval(tick); paintTimer(); save(); }
function setPhase(p, autostart){ pauseTimer(); S.phase=p; const q=curQ();
  S.timeLeft=S.total = p==='think'?q.think : p==='pair'?q.pair : 0; render(); if(autostart&&p!=='share') startTimer(); }
function paintTimer(){
  const t=$('#time'); if(!t) return;
  t.textContent=fmt(S.timeLeft);
  $('#tsub').textContent = S.timeLeft===0 ? "Time's up" : S.running ? 'Running' : 'Paused';
  $('#ring').style.strokeDashoffset = CIRC*(1-(S.total?S.timeLeft/S.total:0));
  $('#ringwrap').classList.toggle('urgent', S.timeLeft<=5&&S.timeLeft>0&&S.running);
  const pp=$('#playpause'); if(pp) pp.textContent=S.running?'Pause':'Start';
}

/* ===================== NAVIGATION (PowerPoint-like) ===================== */
function goSlide(i, phase='think'){
  pauseTimer(); S.slide=Math.max(0,Math.min(slideCount()-1,i)); S.picked=null; S.twist=null; S.confirm=false;
  if(kind(S.slide)==='question'){ S.phase=phase; const q=curQ(); S.timeLeft=S.total= phase==='think'?q.think: phase==='pair'?q.pair:0; }
  save(); render(true);
  if(kind(S.slide)==='final') beep(659,.15,4);
}
function next(){
  if(kind(S.slide)==='question'){
    if(S.phase==='think') return setPhase('pair', true);
    if(S.phase==='pair') return setPhase('share');
  }
  if(S.slide<slideCount()-1) goSlide(S.slide+1);
}
function prev(){
  if(kind(S.slide)==='question'){
    if(S.phase==='share') return setPhase('pair');
    if(S.phase==='pair') return setPhase('think');
  }
  if(S.slide>0){ const t=S.slide-1; goSlide(t, kind(t)==='question'?'share':'think'); }
}

/* ===================== SLIDES ===================== */
function scoreStrip(){
  const max=Math.max(...S.scores.slice(0,S.teamCount));
  return `<div class="scores">${teamIdx().map(t=>`
    <div class="score ${S.scores[t]===max&&max>0?'leader':''}" style="${teamVars(t)}">
      <span class="tn">${TEAMS[t].name}</span><span class="num" id="score-${t}">${S.scores[t]}</span>
      <span class="lead">${S.scores[t]===max&&max>0?'Leading':members(t).length+' players'}</span></div>`).join('')}</div>`;
}

function titleSlide(){
  return `<div class="slide title-slide">
    <div class="eyebrow">IELTS Speaking</div>
    <h1 class="display big rise">Row<span>Battle</span></h1>
    <p class="sub">Topic: <b>Study &amp; Learning Languages</b><br>Think · Pair · Share - every row is a team.</p>
    <div class="blocks">${TEAMS.map((t,i)=>`<div style="--c:${t.c}">${t.name}<span>Team ${i+1}</span></div>`).join('')}</div>
  </div>`;
}

function rulesSlide(){
  const R=[
    ['Each row is a team','Stay in your seat. <b>No moving chairs.</b> Your row works together.','var(--t3)'],
    ['Think','Read the question. Write <b>key words</b> in your notebook. <b>No talking.</b>','var(--think)'],
    ['Pair','Turn to the person next to you. Both partners answer - <b>English only!</b>','var(--pair)'],
    ['Share','The name picker chooses <b>one student</b>. Answer to the teacher.','var(--share)'],
    ['Score','Points go to the speaker’s row.<div class="pts" style="margin-top:10px"><span>+1 answer</span><span>+2 + reason</span><span>+3 + example</span></div>','var(--accent)'],
    ['Twist cards','Watch out for <b>Double points</b>, <b>Help line</b>, <b>Steal!</b> and <b>Why? Why? Why?</b><br>Vietnamese in Pair time = <b>−1</b>.','var(--t0)'],
  ];
  return `<div class="slide">
    <div class="head"><div><div class="eyebrow">Before we start</div><h1 class="display">How to <span>play</span></h1></div></div>
    <div class="rules">${R.map((r,i)=>`<div class="panel rule enter" style="--c:${r[2]};animation-delay:${i*.05}s"><span class="n">${i+1}</span><h3>${r[0]}</h3><p>${r[1]}</p></div>`).join('')}</div>
  </div>`;
}

function teamsSlide(){
  return `<div class="slide">
    <div class="head">
      <div><div class="eyebrow">Seating plan</div><h1 class="display">The <span>teams</span></h1></div>
      <div class="row">
        <button class="btn sm" id="reset">Reset scores</button>
      </div>
    </div>
    ${S.confirm?`<div class="confirm">Reset all scores and picked names?<div class="row"><button class="btn sm primary" id="confirmYes">Yes, reset</button><button class="btn sm" id="confirmNo">Cancel</button></div></div>`:''}
    <div class="teamsgrid" style="--cols:${S.teamCount}">${teamIdx().map(t=>`
      <div class="tbox" style="${teamVars(t)}">
        <h3><span><i></i>${TEAMS[t].name}</span><span>${members(t).length} present · ${S.scores[t]} pts</span></h3>
        <div class="names">${roster(t).map((s,i)=> isAbsent(s)
          ? `<span class="name off"><b>${i+1}</b>${esc(s)}<button class="x" data-back="${esc(s)}" aria-label="Mark ${esc(s)} present" title="Present again">↺</button></span>`
          : `<span class="name"><b>${i+1}</b>${esc(s)}<button class="x" data-absent="${esc(s)}" aria-label="Mark ${esc(s)} absent" title="Absent">×</button></span>`).join('')}</div>
      </div>`).join('')}</div>
    <div class="panel" style="padding:20px 24px;display:grid;gap:12px">
      <div class="row" style="justify-content:space-between"><span style="font-weight:800;font-size:20px">Questions in this game</span>
        <button class="btn sm" id="preset">30-min preset</button></div>
      <div class="qpick">${QUESTIONS.map((q,i)=>`<button data-toggle="${i}" class="${S.rounds.includes(i)?'in':''}" style="--pc:${PART_COLOR[q.part]}" title="${esc(q.q)}">P${q.part} · ${q.part===2?'Cue card':(i<5?i+1:i-5)}</button>`).join('')}</div>
    </div>
  </div>`;
}

function questionSlide(){
  const q=curQ(), r=S.slide-Q0, idx=PHASES.indexOf(S.phase);
  const instr = S.phase==='think' ? 'Read the question. Write <b>key words</b> in your notebook. <b>No talking.</b>'
    : (q.pairNote || 'Turn to your partner. Partner A answers first, then swap. Give a <b>reason</b> and an <b>example</b>.');
  const frac=S.total?S.timeLeft/S.total:0;
  return `<div class="slide">
    <div class="head">
      <div><div class="eyebrow">Question ${r+1} of ${S.rounds.length}</div><h1 class="display">Row <span>Battle</span></h1></div>
      ${scoreStrip()}
    </div>
    <div class="stage">
      <section class="panel qcard">
        <div class="qtop"><span class="tag" style="--pc:${PART_COLOR[q.part]}"><i></i>${q.label}</span></div>
        <h2 class="question ${q.q.length>60?'long':''}">${esc(q.q)}</h2>
        ${q.cue?`<div class="cue"><div class="eyebrow">You should say</div><ul>${q.cue.map(c=>`<li>${esc(c)}</li>`).join('')}</ul></div>`:''}
        ${!q.cue ? `<div class="lang"><div class="eyebrow">Useful language</div><ul>${q.help.map(h=>`<li>${h}</li>`).join('')}</ul></div>`:''}
        ${q.cue ? `<div class="lang"><div class="eyebrow">Useful language</div><ul>${q.help.slice(0,2).map(h=>`<li>${h}</li>`).join('')}</ul></div>`:''}
      </section>
      <aside class="panel console" style="--pc:${PHASE[S.phase].c}">
        <div class="steps">${PHASES.map((p,i)=>`<button class="step ${p===S.phase?'on':i<idx?'past':''}" data-phase="${p}" style="--pc:${PHASE[p].c}">${PHASE[p].label}<small>${PHASE[p].sub}</small></button>`).join('')}</div>
        ${S.phase==='share'?shareBlock():`
        <div class="ringwrap" id="ringwrap">
          <svg viewBox="0 0 300 300" aria-hidden="true"><circle class="ring-bg" cx="150" cy="150" r="130"/>
            <circle class="ring" id="ring" cx="150" cy="150" r="130" stroke-dasharray="${CIRC}" stroke-dashoffset="${CIRC*(1-frac)}"/></svg>
          <div class="ringtext"><div class="time" id="time">${fmt(S.timeLeft)}</div><div class="eyebrow" id="tsub">${S.running?'Running':'Paused'}</div></div>
        </div>
        <div class="instr">${instr}</div>
        <div class="row" style="margin-top:auto">
          <button class="btn primary" id="playpause" style="flex:1">${S.running?'Pause':'Start'}</button>
          <button class="btn" id="plus30">+30s</button>
        </div>`}
      </aside>
    </div>
  </div>`;
}

function shareBlock(){
  const p=S.picked, tw=S.twist?TWISTS.find(x=>x.key===S.twist):null, mult=S.twist==='double'?2:1;
  let scoring='';
  if(p){ const t=S.teamOf[p];
    scoring=`<div class="row">${[1,2,3].map(n=>`<button class="btn team" style="${teamVars(t)}" data-score="${n*mult}" data-team="${t}">+${n*mult}</button>`).join('')}
      ${S.twist==='extend'?`<button class="btn" data-score="1" data-team="${t}">Bonus +1</button>`:''}</div>
      ${S.twist==='steal'?`<div class="row"><span class="hint">Steal +2 →</span>${teamIdx().filter(x=>x!==t).map(x=>`<button class="btn team" style="${teamVars(x)};font-size:20px;min-width:0;padding:10px 14px" data-score="2" data-team="${x}">${TEAMS[x].name}</button>`).join('')}</div>`:''}`; }
  return `
    <div class="ticket" ${p?`style="${teamVars(S.teamOf[p])}"`:''}>
      <div class="eyebrow">${p?'Speaker':'Who answers?'}</div>
      <div class="who ${p?'rise':''}" id="who">${p?esc(p):'? ? ?'}</div>
      ${p?`<span class="teamline">${TEAMS[S.teamOf[p]].name}</span>`:''}
    </div>
    ${tw?`<div class="twist rise"><span class="display">${tw.title}</span><p>${tw.text}</p></div>`:''}
    ${p?scoring:`<button class="btn primary" id="spin" style="font-size:30px;padding:22px">Pick a student</button>`}
    <div style="margin-top:auto;display:grid;gap:10px">
      ${p?`<button class="btn sm" id="spin">Pick again</button>`:''}
      <details class="adjust"><summary>Adjust scores</summary>
        <div class="row" style="margin-top:8px;gap:8px">${teamIdx().map(t=>`
          <span class="adj" style="${teamVars(t)}">${TEAMS[t].name}
            <button data-score="-1" data-team="${t}" aria-label="${TEAMS[t].name} minus one">−1</button>
            <button data-score="1" data-team="${t}" aria-label="${TEAMS[t].name} plus one">+1</button></span>`).join('')}</div>
      </details>
    </div>`;
}

function finalSlide(){
  const order=teamIdx().sort((a,b)=>S.scores[b]-S.scores[a]);
  const top=S.scores[order[0]], tie=order.filter(t=>S.scores[t]===top).length>1, maxH=Math.max(1,top);
  return `<div class="slide final">
    <div class="eyebrow">Final result</div>
    <h2 class="display rise">${tie?"It's a tie!":TEAMS[order[0]].name+' wins!'}</h2>
    <div class="podium">${order.map((t,i)=>`
      <div class="pod rise" style="${teamVars(t)};height:${140+260*(S.scores[t]/maxH)}px;animation-delay:${.15+i*.1}s">
        <span class="eyebrow" style="color:#141A33">#${i+1}</span><span class="display">${TEAMS[t].name}</span>
        <span class="n">${S.scores[t]}</span><small>${members(t).join(' · ')}</small></div>`).join('')}</div>
  </div>`;
}

function bar(){
  const n=slideCount();
  return `<div class="bar">
    <button class="nav" id="prev" aria-label="Previous" ${S.slide===0&&kind(0)!=='question'?'disabled':''}>←</button>
    <button class="nav" id="next" aria-label="Next" ${S.slide===n-1?'disabled':''}>→</button>
    <span class="count">${S.slide+1} / ${n}</span>
    <div class="prog"><i style="width:${(S.slide/(n-1))*100}%"></i></div>
    <span class="keys">→ next · Space timer · P pick · F full screen</span>
    <button class="barbtn" id="toTeams">Teams</button>
    <button class="barbtn" id="fs">Full screen</button>
  </div>`;
}

function render(animate){
  const k=kind(S.slide);
  const html = k==='title'?titleSlide(): k==='rules'?rulesSlide(): k==='teams'?teamsSlide(): k==='final'?finalSlide(): questionSlide();
  $('#deck').innerHTML = html + bar();
  if(animate){ const s=$('.slide'); s.classList.add('enter'); }
  bind();
}

/* ===================== ACTIONS ===================== */
function spin(){
  const present=STUDENTS.filter(s=>!isAbsent(s));
  let pool=present.filter(s=>!S.picks.includes(s));
  if(!pool.length){ S.picks=[]; pool=[...present]; }
  const final=pool[Math.floor(Math.random()*pool.length)];
  $$('#spin').forEach(b=>b.disabled=true); S.twist=null; S.picked=null;
  if(!$('#who')){ render(); }
  const el=$('#who'); el.classList.remove('rise'); let i=0;
  (function roll(){
    el.textContent=pool[Math.floor(Math.random()*pool.length)]; beep(380+Math.random()*320,.035); i++;
    if(i<24) setTimeout(roll, 35+i*i*.55);
    else { S.picked=final; S.picks.push(final);
      S.twist=Math.random()<.35?TWISTS[Math.floor(Math.random()*TWISTS.length)].key:null;
      beep(1046,.18,2); save(); render(); }
  })();
}
function addScore(t,n){ S.scores[t]=Math.max(0,S.scores[t]+n); save(); render();
  const el=$('#score-'+t); if(el) el.classList.add('bump'); if(n>0) beep(784,.12); }
function toggleFS(){ try{ if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{}); else document.exitFullscreen().catch(()=>{}); }catch(e){} }

function bind(){
  $('#prev').onclick=prev; $('#next').onclick=next; $('#fs').onclick=toggleFS;
  $('#toTeams').onclick=()=>goSlide(2);
  $$('[data-absent]').forEach(b=>b.onclick=()=>{ S.absent=[...(S.absent||[]), b.dataset.absent]; save(); render(); });
  $$('[data-back]').forEach(b=>b.onclick=()=>{ S.absent=(S.absent||[]).filter(x=>x!==b.dataset.back); save(); render(); });
  const rs=$('#reset'); if(rs) rs.onclick=()=>{ S.confirm=true; render(); };
  const cy=$('#confirmYes'); if(cy) cy.onclick=()=>{ S.scores=[0,0,0]; S.picks=[]; S.confirm=false; save(); render(); };
  const cn=$('#confirmNo'); if(cn) cn.onclick=()=>{ S.confirm=false; render(); };
  $$('[data-toggle]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.toggle;
    S.rounds=S.rounds.includes(i)?S.rounds.filter(x=>x!==i):[...S.rounds,i].sort((a,b)=>a-b); if(!S.rounds.length) S.rounds=[i]; save(); render(); });
  const pr=$('#preset'); if(pr) pr.onclick=()=>{ S.rounds=[...PRESET]; save(); render(); };
  $$('[data-phase]').forEach(b=>b.onclick=()=>setPhase(b.dataset.phase));
  const pp=$('#playpause'); if(pp) pp.onclick=()=>S.running?pauseTimer():startTimer();
  const p30=$('#plus30'); if(p30) p30.onclick=()=>{ S.timeLeft+=30; S.total=Math.max(S.total,S.timeLeft); paintTimer(); save(); };
  $$('#spin').forEach(b=>b.onclick=spin);
  $$('[data-score]').forEach(b=>b.onclick=()=>addScore(+b.dataset.team,+b.dataset.score));
}

document.addEventListener('keydown',e=>{
  const k=e.key;
  if(k==='ArrowRight'||k==='PageDown'||k==='Enter'&&!e.target.closest('button')){ e.preventDefault(); next(); }
  else if(k==='ArrowLeft'||k==='PageUp'){ e.preventDefault(); prev(); }
  else if(e.code==='Space'){ if(kind(S.slide)==='question'&&S.phase!=='share'){ e.preventDefault(); S.running?pauseTimer():startTimer(); } }
  else if(k==='p'||k==='P'){ const b=$('#spin'); if(b&&!b.disabled) b.click(); }
  else if(k==='f'||k==='F'){ toggleFS(); }
  else if(k==='Home'){ goSlide(0); }
});

if(S.slide>=slideCount()) S.slide=0;
if(kind(S.slide)==='question' && !S.total){ const q=curQ(); S.timeLeft=S.total=q.think; S.phase='think'; }
render(); fit();
</script>

</body>
</html>
